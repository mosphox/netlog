<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>netlog</title>
<style>
  :root{
    --base:#eef1f5; --surface:#ffffff; --sunk:#f6f8fa; --ink:#17202c; --muted:#5d6b7d; --faint:#8a96a6;
    --rule:#d6dde6; --hover:#f0f4fa; --accent:#1e5fd8; --accent-ink:#ffffff; --sel:#e3ecfc;
    --ok:#1f8a4c; --redir:#5b6cc9; --warn:#b26a00; --bad:#c9302c; --bad-bg:#fdecec; --warn-bg:#fff4e0;
    --bar:#b8c3d1; --bar-slow:#d9962b;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --row:28px;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --base:#141920; --surface:#1b212a; --sunk:#171c24; --ink:#e3e8ef; --muted:#9aa7b8; --faint:#6c7889;
      --rule:#2a323d; --hover:#212833; --accent:#5b93f5; --accent-ink:#0d1420; --sel:#22324d;
      --ok:#4cc27e; --redir:#8f9cf0; --warn:#e3a640; --bad:#f06b66; --bad-bg:#3a1f22; --warn-bg:#3a2e17;
      --bar:#3f4a59; --bar-slow:#b07a1f; color-scheme:dark;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--base);color:var(--ink);font:13px/1.45 var(--sans);display:flex;flex-direction:column;overflow:hidden}
  button,input{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
  .mono{font-family:var(--mono);font-size:12px}

  /* top bar */
  .top{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--rule);flex-wrap:wrap}
  .brand{font-weight:700;font-size:15px;letter-spacing:-.01em}
  .state{display:flex;align-items:center;gap:8px;color:var(--muted);min-width:0}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
  .dot.off{background:var(--bad)}
  .state .mono{color:var(--ink)}
  .spacer{flex:1}
  .btn{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:5px 11px;cursor:pointer;white-space:nowrap}
  .btn:hover{background:var(--hover)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .btn.primary:hover{filter:brightness(1.07)}
  .btn[aria-pressed="true"]{background:var(--sel);border-color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:default}

  .settings{position:absolute;right:14px;top:46px;z-index:20;width:min(420px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px;box-shadow:0 12px 32px rgba(15,25,40,.18);display:none}
  .settings.open{display:block}
  .settings h2{font-size:14px;margin:0 0 12px}
  .field{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:6px 10px;margin-bottom:10px}
  .field label{color:var(--muted)}
  .field input[type=text],.field input[type=number]{background:var(--sunk);border:1px solid var(--rule);border-radius:6px;padding:5px 8px;width:100%;font-family:var(--mono);font-size:12px}
  .check{display:flex;gap:8px;align-items:flex-start;margin:8px 0;cursor:pointer}
  .check input{margin-top:3px;accent-color:var(--accent)}
  .check small{display:block;color:var(--muted)}
  .fpbox{margin-top:12px;padding-top:12px;border-top:1px solid var(--rule);color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
  .fpbox .mono{color:var(--ink);word-break:break-all;font-size:11px}
  .note{min-height:18px;font-size:12px}
  .note.ok{color:var(--ok)} .note.err{color:var(--bad)}

  /* filter bar */
  .bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--rule);flex-wrap:wrap}
  .search{flex:1 1 280px;position:relative}
  .search input{width:100%;background:var(--sunk);border:1px solid var(--rule);border-radius:6px;padding:6px 10px;font-family:var(--mono);font-size:12px}
  .chips{display:flex;gap:4px;flex-wrap:wrap}
  .chip{border:1px solid transparent;background:none;border-radius:999px;padding:3px 10px;cursor:pointer;color:var(--muted);display:flex;gap:6px;align-items:baseline}
  .chip:hover{background:var(--hover)}
  .chip b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .chip[aria-pressed="true"]{background:var(--sel);border-color:var(--accent);color:var(--ink)}
  .chip.c5 b,.chip.cf b{color:var(--bad)} .chip.c4 b{color:var(--warn)}
  .banner{padding:6px 14px;background:var(--bad-bg);color:var(--bad);border-bottom:1px solid var(--rule);display:none}
  .banner.show{display:block}

  /* main split */
  main{flex:1;display:flex;min-height:0}
  .list{flex:0 0 52%;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--rule);background:var(--surface)}
  .grid{display:grid;grid-template-columns:62px 58px 42px minmax(0,1fr) 54px 58px 96px;align-items:center;column-gap:8px;padding:0 12px}
  .head{height:28px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--rule);background:var(--sunk)}
  .head .r,.row .r{text-align:right}
  .rows{flex:1;overflow:auto;position:relative;outline:none}
  .spacer-v{position:relative}
  .row{position:absolute;left:0;right:0;height:var(--row);cursor:pointer;border-bottom:1px solid var(--rule);white-space:nowrap}
  .row:hover{background:var(--hover)}
  .row.sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
  .row.failed{background:var(--bad-bg)}
  .row.failed.sel{background:var(--sel)}
  .row > *{overflow:hidden;text-overflow:ellipsis}
  .t{color:var(--faint);font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
  .m{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted)}
  .m.POST,.m.PUT,.m.PATCH,.m.DELETE{color:var(--accent)}
  .s{font-family:var(--mono);font-size:12px;font-weight:600}
  .s.ok{color:var(--ok)} .s.redir{color:var(--redir)} .s.warn{color:var(--warn)} .s.bad{color:var(--bad)} .s.ws{color:var(--accent)}
  .u{font-family:var(--mono);font-size:12px}
  .u .h{color:var(--ink)} .u .p{color:var(--muted)}
  .badge{font-family:var(--sans);font-size:10px;border-radius:4px;padding:0 4px;margin-right:6px;background:var(--warn-bg);color:var(--warn)}
  .ty{color:var(--muted);font-size:11px}
  .sz{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
  .dur{display:flex;align-items:center;gap:6px;justify-content:flex-end;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .dur i{display:block;height:6px;border-radius:3px;background:var(--bar);flex:none}
  .dur i.slow{background:var(--bar-slow)} .dur i.bad{background:var(--bad)}
  .listfoot{padding:6px 12px;border-top:1px solid var(--rule);color:var(--muted);font-size:12px;display:flex;gap:10px;align-items:center;background:var(--sunk)}
  .empty{padding:40px 24px;color:var(--muted);text-align:center;max-width:460px;margin:0 auto}
  .empty strong{display:block;color:var(--ink);font-size:14px;margin-bottom:6px}

  /* detail */
  .detail{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--base)}
  .dtop{padding:12px 16px 0;background:var(--surface);border-bottom:1px solid var(--rule)}
  .back{display:none;margin-bottom:8px}
  .durl{font-family:var(--mono);font-size:12px;word-break:break-all;line-height:1.5;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden}
  .durl.full{display:block;max-height:40vh;overflow:auto}
  .more{margin-top:2px}
  .durl .m{font-size:12px;margin-right:6px}
  .dfacts{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);margin:8px 0 10px;align-items:center}
  .dfacts .s{font-size:13px}
  .actions{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .tabs{display:flex;gap:2px;margin-top:2px}
  .tab{background:none;border:none;border-bottom:2px solid transparent;padding:7px 12px;cursor:pointer;color:var(--muted)}
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
  .dbody{flex:1;overflow:auto;padding:14px 16px 40px}
  .sec{margin:0 0 18px}
  .sec h3{font-size:13px;margin:0 0 6px;display:flex;align-items:center;gap:10px}
  .sec h3 .aside{font-weight:400;color:var(--muted);font-size:12px;display:flex;gap:10px;flex-wrap:wrap}
  .kv{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;background:var(--surface);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
  .kv > div{padding:4px 10px;border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:12px;word-break:break-all;min-width:0}
  .kv > div:nth-last-child(-n+2){border-bottom:none}
  .kv .k{color:var(--muted);background:var(--sunk);word-break:normal;white-space:nowrap}
  .kv.plain > div{font-family:var(--sans);font-size:13px}
  .errbox{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:10px 12px;margin-bottom:16px;font-family:var(--mono);font-size:12px;word-break:break-word}
  pre{margin:0;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;max-width:100%}
  pre.hex{white-space:pre;overflow:auto}
  .link{background:none;border:none;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
  a{color:var(--accent)}
  .seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
  .seg button{background:var(--surface);border:none;padding:2px 9px;cursor:pointer;color:var(--muted);font-size:12px}
  .seg button[aria-pressed="true"]{background:var(--sel);color:var(--ink)}
  .msgs{background:var(--surface);border:1px solid var(--rule);border-radius:8px}
  .msg{display:grid;grid-template-columns:22px 70px 54px 60px 1fr;gap:8px;padding:5px 10px;border-bottom:1px solid var(--rule);align-items:start;font-size:12px}
  .msg:last-child{border-bottom:none}
  .msg .dir{font-weight:700} .msg .dir.out{color:var(--accent)} .msg .dir.in{color:var(--ok)}
  .msg pre{border:none;padding:0;background:none}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--base);padding:7px 14px;border-radius:8px;opacity:0;transition:opacity .15s;pointer-events:none;z-index:40}
  .toast.show{opacity:1}
  .kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);border-radius:4px;padding:0 4px;color:var(--muted)}

  @media (max-width: 1100px){
    .grid{grid-template-columns:42px 40px minmax(0,1fr) 58px 96px}
    .grid .t,.grid .ty{display:none}
  }
  @media (max-width: 767px){
    .list{flex:1 1 auto;border-right:none}
    .detail{display:none}
    body.show-detail .list{display:none}
    body.show-detail .detail{display:flex}
    .back{display:inline-block}
    .grid{grid-template-columns:40px minmax(0,1fr) 92px;padding:0 10px}
    .grid .m,.grid .sz{display:none}
    .state .via{display:none}
    .kv{grid-template-columns:1fr}
    .kv .k{border-bottom:none !important;padding-bottom:0;background:none}
    .msg{grid-template-columns:18px 54px 1fr}
    .msg .mt,.msg .ml{display:none}
  }
  @media (prefers-reduced-motion: reduce){ .toast{transition:none} }
</style>
</head>
<body>
<header class="top">
  <span class="brand">netlog</span>
  <span class="state" id="state"><span class="dot" id="dot"></span><span>Proxy <span class="mono" id="proxyaddr">…</span></span><span class="via">via <span class="mono" id="via">…</span></span></span>
  <span class="spacer"></span>
  <button class="btn" id="harbtn" title="Download every request in the list as a HAR 1.2 file">Export HAR</button>
  <button class="btn" id="setbtn" aria-expanded="false" aria-controls="settings">Settings</button>
  <section class="settings" id="settings" aria-label="Settings">
    <h2>Proxy settings</h2>
    <div class="field"><label for="port">Listen port</label><input type="number" id="port" min="1" max="65535"></div>
    <div class="field"><label for="upstream">Upstream proxy</label><input type="text" id="upstream" placeholder="blank connects directly" spellcheck="false"></div>
    <label class="check"><input type="checkbox" id="mitm"><span>Decrypt HTTPS<small>Off passes HTTPS through untouched and unlogged.</small></span></label>
    <label class="check"><input type="checkbox" id="forceua"><span>Send the Firefox 158 User-Agent<small>Overrides whatever the browser sends.</small></span></label>
    <div class="note" id="note" role="status"></div>
    <a href="/ca.pem" download>Download the CA certificate</a>
    <div class="fpbox"><span>JA4</span><span class="mono" id="ja4">…</span><span>JA3</span><span class="mono" id="ja3">…</span><span>Akamai</span><span class="mono" id="akamai">…</span><span>UA</span><span class="mono" id="ua">…</span></div>
  </section>
</header>
<div class="bar">
  <div class="search"><input type="search" id="filter" aria-label="Filter requests" placeholder="Filter: megamarket status:5xx -type:image method:post" spellcheck="false" autocomplete="off"></div>
  <div class="chips" id="chips" role="group" aria-label="Status"></div>
  <button class="btn" id="live" aria-pressed="true" title="Keep the newest request in view">Live</button>
  <button class="btn" id="clear" title="Empty the list. Logs on disk are kept.">Clear list</button>
</div>
<div class="banner" id="banner" role="alert">Can't reach netlog. Retrying every few seconds.</div>
<main>
  <section class="list" aria-label="Requests">
    <div class="grid head" aria-hidden="true"><span class="t">Time</span><span class="m">Method</span><span>Status</span><span>URL</span><span class="ty">Type</span><span class="sz r">Size</span><span class="r">Time taken</span></div>
    <div class="rows" id="rows" tabindex="0" aria-label="Request list. Use j and k to move.">
      <div class="spacer-v" id="spacer"></div>
      <div class="empty" id="empty"><strong>Loading requests</strong></div>
    </div>
    <div class="listfoot"><span id="count">0 requests</span><span class="spacer"></span><button class="link" id="older" hidden>Load older</button><span><span class="kbd">/</span> filter <span class="kbd">j</span><span class="kbd">k</span> move</span></div>
  </section>
  <section class="detail" aria-label="Request detail">
    <div class="dtop">
      <button class="btn back" id="back">Back to list</button>
      <div class="durl" id="durl"><span class="empty-sel" style="color:var(--muted);font-family:var(--sans)">Select a request to see it in full.</span></div>
      <div class="dfacts" id="dfacts"></div>
      <div class="tabs" role="tablist" id="tabs"></div>
    </div>
    <div class="dbody" id="dbody" role="tabpanel"></div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
const $ = s => document.querySelector(s);
function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

let rows = [];            // newest first
const byId = new Map();
let maxId = 0, oldestId = 0, moreOlder = false;
let view = [];            // filtered rows
let selId = null, detail = null, tab = 'overview', chip = 'all';
let live = true, status = null;
const ROW = 28;

// ---------- formatting ----------
const fmtSize = n => n==null ? '' : n<1024 ? n+' B' : n<1048576 ? (n/1024).toFixed(n<10240?1:0)+' KB' : (n/1048576).toFixed(1)+' MB';
const fmtMs = ms => ms==null ? '' : ms<1000 ? ms+' ms' : (ms/1000).toFixed(ms<10000?2:1)+' s';
const fmtTime = iso => { const d=new Date(iso); return d.toTimeString().slice(0,8); };
function splitUrl(u){ try{ const p=new URL(u); return {host:p.host, path:p.pathname+p.search}; }catch{ return {host:'', path:u}; } }
function statusClass(r){ if(r.err) return 'bad'; const s=r.status; if(s===101) return 'ws'; if(!s) return ''; if(s<300) return 'ok'; if(s<400) return 'redir'; if(s<500) return 'warn'; return 'bad'; }
function statusLabel(r){ if(r.err) return 'ERR'; if(r.status===101) return 'WS'; return r.status||'…'; }
function shortType(ct){
  if(!ct) return ''; ct=ct.toLowerCase();
  if(ct.includes('json')) return 'json'; if(ct.includes('html')) return 'html'; if(ct.includes('javascript')||ct.includes('ecmascript')) return 'js';
  if(ct.includes('css')) return 'css'; if(ct.startsWith('image/')) return ct.slice(6).replace('svg+xml','svg'); if(ct.includes('font')) return 'font';
  if(ct.includes('xml')) return 'xml'; if(ct.startsWith('text/')) return ct.slice(5); if(ct.startsWith('video/')||ct.startsWith('audio/')) return 'media';
  return ct.split('/').pop().slice(0,8);
}
const isFailed = r => !!r.err || r.status >= 500;

// ---------- filter ----------
function parseFilter(q){
  return q.trim().split(/\s+/).filter(Boolean).map(tok => {
    let neg = false; if(tok.startsWith('-') && tok.length>1){ neg=true; tok=tok.slice(1); }
    const i = tok.indexOf(':');
    if(i>0){ return {neg, key:tok.slice(0,i).toLowerCase(), val:tok.slice(i+1).toLowerCase()}; }
    return {neg, key:'', val:tok.toLowerCase()};
  });
}
function statusMatch(s, v){
  if(/^[1-5]xx$/.test(v)) return Math.floor(s/100)===+v[0];
  if(/^[<>]=?\d+$/.test(v)){ const n=+v.replace(/[<>=]/g,''); return v[0]==='>' ? (v[1]==='='? s>=n : s>n) : (v[1]==='='? s<=n : s<n); }
  return String(s)===v;
}
function termMatch(r, t){
  const v=t.val;
  switch(t.key){
    case 'host': case 'domain': return (r.host||'').toLowerCase().includes(v);
    case 'status': case 'code': return statusMatch(r.status||0, v);
    case 'method': return (r.method||'').toLowerCase()===v;
    case 'type': case 'ct': return shortType(r.ct)===v || (r.ct||'').toLowerCase().includes(v);
    case 'path': case 'url': return (r.url||'').toLowerCase().includes(v);
    case 'is':
      if(v==='err'||v==='failed'||v==='error') return isFailed(r);
      if(v==='ws') return !!r.ws;
      if(v==='retried') return (r.attempts||0)>1;
      if(v==='replay') return (r.client||'').startsWith('replay');
      return false;
    default: return (r.url||'').toLowerCase().includes(v) || (r.method||'').toLowerCase()===v || String(r.status)===v || (r.err||'').toLowerCase().includes(v);
  }
}
const CHIPS = [
  ['all','All', r=>true], ['2xx','2xx', r=>!r.err && r.status>=200 && r.status<300], ['3xx','3xx', r=>!r.err && r.status>=300 && r.status<400],
  ['4xx','4xx', r=>!r.err && r.status>=400 && r.status<500, 'c4'], ['5xx','5xx', r=>!r.err && r.status>=500, 'c5'],
  ['failed','Failed', r=>!!r.err, 'cf'], ['ws','WebSocket', r=>!!r.ws],
];
function applyFilter(){
  const terms = parseFilter($('#filter').value);
  const textMatched = terms.length ? rows.filter(r => terms.every(t => termMatch(r,t) !== t.neg)) : rows;
  const counts = {}; for(const [k,,f] of CHIPS) counts[k]=0;
  for(const r of textMatched) for(const [k,,f] of CHIPS) if(f(r)) counts[k]++;
  const pred = CHIPS.find(c=>c[0]===chip)[2];
  view = textMatched.filter(pred);
  renderChips(counts);
  $('#count').textContent = view.length===rows.length ? `${rows.length} requests` : `${view.length} of ${rows.length} requests`;
  renderRows(true);
}
function renderChips(counts){
  const w=$('#chips'); w.textContent='';
  for(const [k,label,,cls] of CHIPS){
    if(k!=='all' && k!==chip && !counts[k]) continue;
    const b=el('button','chip'+(cls?' '+cls:'')); b.setAttribute('aria-pressed', String(k===chip));
    b.append(el('span',null,label), el('b',null,counts[k]));
    b.onclick=()=>{ chip = chip===k && k!=='all' ? 'all' : k; applyFilter(); };
    w.appendChild(b);
  }
}

// ---------- virtual list ----------
const rowsEl = $('#rows'), spacer = $('#spacer');
const pool = [];
function durBar(r){
  const d=el('span','dur'); const i=el('i');
  const w = r.duration_ms>0 ? Math.max(3, Math.min(36, 36*Math.log10(r.duration_ms+1)/Math.log10(30001))) : 0;
  i.style.width = w+'px';
  if(isFailed(r)) i.className='bad'; else if(r.duration_ms>=3000) i.className='slow';
  d.append(el('span',null, r.ws && r.status===101 ? (r.ws_count? r.ws_count+' msg' : 'open') : fmtMs(r.duration_ms)), i);
  return d;
}
function rowNode(r){
  const n=el('div','row grid'); n.dataset.id=r.id; n.setAttribute('role','option');
  if(r.id===selId) n.classList.add('sel'); if(isFailed(r)) n.classList.add('failed');
  const su=splitUrl(r.url);
  const u=el('span','u');
  if((r.client||'').startsWith('replay')) u.append(el('span','badge','replay'));
  if((r.attempts||0)>1){ const b=el('span','badge','retried'); b.title=`Took ${r.attempts} attempts: earlier ones failed on a dead connection`; u.append(b); }
  u.append(el('span','h',su.host), el('span','p',su.path));
  n.append(el('span','t',fmtTime(r.time)), el('span','m '+r.method,r.method), el('span','s '+statusClass(r),statusLabel(r)), u,
           el('span','ty',shortType(r.ct)), el('span','sz r',fmtSize(r.resp_len)), durBar(r));
  n.title = r.err ? r.err : r.url;
  return n;
}
let lastRange='';
function renderRows(force){
  spacer.style.height = (view.length*ROW)+'px';
  $('#empty').style.display = view.length ? 'none' : 'block';
  if(!view.length) renderEmpty();
  const top=rowsEl.scrollTop, h=rowsEl.clientHeight;
  const from=Math.max(0, Math.floor(top/ROW)-10), to=Math.min(view.length, Math.ceil((top+h)/ROW)+10);
  const key=from+':'+to;
  if(!force && key===lastRange) return; lastRange=key;
  const frag=document.createDocumentFragment();
  for(let i=from;i<to;i++){ const n=rowNode(view[i]); n.style.top=(i*ROW)+'px'; frag.appendChild(n); }
  spacer.replaceChildren(frag);
}
function renderEmpty(){
  const e=$('#empty'); e.textContent='';
  if(!status){ e.append(el('strong',null,'Loading requests')); return; }
  if(rows.length){
    e.append(el('strong',null,'Nothing matches this filter'));
    const b=el('button','link','Clear the filter'); b.onclick=()=>{ $('#filter').value=''; chip='all'; applyFilter(); }; e.append(b);
    return;
  }
  e.append(el('strong',null,'No traffic yet'), el('span',null,`Set Firefox's HTTP and HTTPS proxy to 127.0.0.1:${status.proxy_port}, import the CA certificate from Settings, then browse. Requests show up here as they happen.`));
}
rowsEl.addEventListener('scroll', ()=>{ renderRows(false); if(rowsEl.scrollTop>ROW*2 && live) setLive(false, true); });
rowsEl.addEventListener('click', e=>{ const r=e.target.closest('.row'); if(r) select(+r.dataset.id); });
window.addEventListener('resize', ()=>renderRows(true));

function setLive(on, auto){
  live=on; $('#live').setAttribute('aria-pressed', String(on)); $('#live').textContent = on ? 'Live' : 'Paused';
  if(on){ rowsEl.scrollTop=0; renderRows(true); }
}
$('#live').onclick=()=>setLive(!live);

// ---------- data ----------
let failures=0;
async function poll(){
  try{
    const d=await (await fetch('/api/logs?after='+maxId+'&limit=5000')).json();
    failures=0; $('#banner').classList.remove('show');
    if(d.max_id < maxId){ rows=[]; byId.clear(); maxId=0; } // server cleared or restarted with fewer
    if(d.entries.length){
      const fresh=[];
      for(const e of d.entries){ if(byId.has(e.id)) { Object.assign(byId.get(e.id), e); continue; } byId.set(e.id,e); fresh.push(e); if(e.id>maxId) maxId=e.id; }
      fresh.sort((a,b)=>b.id-a.id);
      const prevTop=rowsEl.scrollTop;
      rows = fresh.concat(rows);
      if(!oldestId && rows.length){ oldestId=rows[rows.length-1].id; moreOlder = d.entries.length>=5000; $('#older').hidden=!moreOlder; }
      const before=view.length; applyFilter();
      if(!live) rowsEl.scrollTop = prevTop + (view.length-before)*ROW; // keep the reader's place
    } else if(!status || !rows.length) applyFilter();
    if(selId && detail && detail.ws_open) refreshDetail();
  }catch(e){ if(++failures>=2) $('#banner').classList.add('show'); }
}
$('#older').onclick=async()=>{
  const d=await (await fetch('/api/logs?before='+oldestId+'&limit=5000')).json();
  for(const e of d.entries){ if(!byId.has(e.id)){ byId.set(e.id,e); rows.push(e); } }
  if(d.entries.length) oldestId=d.entries[d.entries.length-1].id;
  moreOlder=d.entries.length>=5000; $('#older').hidden=!moreOlder; applyFilter();
};

async function loadStatus(){
  try{
    status=await (await fetch('/api/status')).json();
    $('#dot').className='dot'+(status.listening?'':' off');
    $('#proxyaddr').textContent='127.0.0.1:'+status.proxy_port;
    $('#via').textContent=status.upstream;
    for(const [id,k] of [['ja4','ja4'],['ja3','ja3_hash'],['akamai','akamai_hash'],['ua','user_agent']]) $('#'+id).textContent=status[k];
    if(!$('#settings').classList.contains('open')){
      $('#port').value=status.proxy_port; $('#upstream').value=status.upstream_url||''; $('#mitm').checked=status.mitm; $('#forceua').checked=status.force_ua;
    }
    if(!rows.length) renderEmpty();
  }catch{}
}

// ---------- selection & detail ----------
function moveSel(delta){
  if(!view.length) return;
  let i=view.findIndex(r=>r.id===selId); i = i<0 ? 0 : Math.max(0, Math.min(view.length-1, i+delta));
  select(view[i].id);
  const y=i*ROW; if(y<rowsEl.scrollTop) rowsEl.scrollTop=y; else if(y+ROW>rowsEl.scrollTop+rowsEl.clientHeight) rowsEl.scrollTop=y+ROW-rowsEl.clientHeight;
}
async function select(id){
  selId=id; renderRows(true); document.body.classList.add('show-detail');
  const r=await fetch('/api/logs/'+id); if(!r.ok){ toast('That request is no longer in the log'); return; }
  detail=await r.json();
  if(tab==='messages' && !detail.ws_messages.length) tab='overview';
  if(detail.status===101 && tab==='overview' && detail.ws_messages.length) tab='messages';
  renderDetail();
}
async function refreshDetail(){
  const r=await fetch('/api/logs/'+selId); if(!r.ok) return;
  const d=await r.json(); if(d.id!==selId) return;
  const changed = d.ws_messages.length!==detail.ws_messages.length || d.ws_open!==detail.ws_open;
  detail=d; if(changed) renderDetail(true);
}
function renderDetail(keepScroll){
  const d=detail, sc=$('#dbody').scrollTop;
  const u=$('#durl'); u.textContent=''; u.classList.remove('full'); u.append(el('span','m '+d.method,d.method), document.createTextNode(d.url));
  $('#more')?.remove();
  if(d.url.length>220){ const m=el('button','link more','Show full URL'); m.id='more'; m.onclick=()=>{ const f=u.classList.toggle('full'); m.textContent=f?'Show less':'Show full URL'; }; u.after(m); }
  const f=$('#dfacts'); f.textContent='';
  f.append(el('span','s '+statusClass(d), d.err ? 'Failed' : d.status===101 ? '101 WebSocket' : (d.status+' '+(d.resp_proto||''))));
  f.append(el('span',null, d.status===101 ? (d.ws_open ? 'open' : 'closed after '+fmtMs(d.duration_ms)) : fmtMs(d.duration_ms)));
  if(d.resp_body.size) f.append(el('span',null, fmtSize(d.resp_body.size)));
  if(d.attempts>1) f.append(el('span',null, `${d.attempts} attempts`));
  const acts=el('span','actions');
  const rp=el('button','btn','Replay'); rp.title='Send this request again through netlog'; rp.onclick=replay; rp.disabled = d.status===101;
  const cc=el('button','btn','Copy as curl'); cc.onclick=()=>copy(curlFor(d),'Copied curl command');
  const cu=el('button','btn','Copy URL'); cu.onclick=()=>copy(d.url,'Copied URL');
  acts.append(rp,cc,cu); f.append(acts);
  const tabs=[['overview','Overview'],['request','Request'],['response','Response']];
  if(d.ws_messages.length || d.status===101) tabs.push(['messages', `Messages (${d.ws_messages.length})`]);
  const t=$('#tabs'); t.textContent='';
  for(const [k,label] of tabs){
    const b=el('button','tab',label); b.setAttribute('role','tab'); b.setAttribute('aria-selected', String(k===tab));
    b.onclick=()=>{ tab=k; renderDetail(); }; t.appendChild(b);
  }
  const body=$('#dbody'); body.textContent='';
  ({overview, request:requestTab, response:responseTab, messages:messagesTab})[tab](body, d);
  if(keepScroll) body.scrollTop=sc;
}
function sec(title, aside){ const s=el('section','sec'); const h=el('h3',null,title); if(aside){ const a=el('span','aside'); a.append(...aside); h.append(a); } s.append(h); return s; }
function kvTable(pairs, plain){
  const g=el('div','kv'+(plain?' plain':''));
  if(!pairs.length){ g.append(el('div','k','none'), el('div')); }
  for(const [k,v] of pairs){ g.append(el('div','k',k), el('div',null,v)); }
  return g;
}
function overview(w, d){
  if(d.err){ w.append(el('div','errbox', d.err)); }
  const s=sec('Summary');
  const pairs=[['Started', new Date(d.time).toLocaleString()],['Duration', fmtMs(d.duration_ms)],['Client', d.client_addr],['Upstream', d.upstream||'direct'],
    ['Protocol', (d.req_proto||'')+(d.resp_proto?'  to browser, '+d.resp_proto+' upstream':'')],
    ['Request body', fmtSize(d.req_body.size)],['Response body', fmtSize(d.resp_body.size)+(d.resp_body.was_decoded?' ('+d.resp_body.encoding+', '+fmtSize(d.resp_body.decoded_size)+' decoded)':'')]];
  if(d.attempts>1) pairs.push(['Attempts', `${d.attempts}: earlier tries failed on a dead connection and were retried on a fresh one`]);
  s.append(kvTable(pairs,true)); w.append(s);
  try{
    const q=[...new URL(d.url).searchParams];
    if(q.length){ const qs=sec('Query parameters'); qs.append(kvTable(q)); w.append(qs); }
  }catch{}
}
function cookiesFrom(headers){
  const out=[];
  for(const h of headers||[]) if(h.name.toLowerCase()==='cookie') for(const part of h.value.split(';')){ const i=part.indexOf('='); if(i>0) out.push([part.slice(0,i).trim(), part.slice(i+1).trim()]); }
  return out;
}
function setCookies(headers){
  return (headers||[]).filter(h=>h.name.toLowerCase()==='set-cookie').map(h=>{ const first=h.value.split(';')[0]; const i=first.indexOf('='); return [first.slice(0,i), h.value.slice(i+1)]; });
}
function requestTab(w, d){
  const hs=sec('Headers', [el('span',null, `${(d.req_headers||[]).length}, in the order sent`)]); hs.append(kvTable((d.req_headers||[]).map(h=>[h.name,h.value]))); w.append(hs);
  const c=cookiesFrom(d.req_headers); if(c.length){ const cs=sec('Cookies'); cs.append(kvTable(c)); w.append(cs); }
  w.append(bodySection('Body', d.req_body, d.id, 'req'));
}
function responseTab(w, d){
  if(d.err){ w.append(el('div','errbox', 'No response: '+d.err)); return; }
  const hs=sec('Headers', [el('span',null, `${(d.resp_headers||[]).length}`)]); hs.append(kvTable((d.resp_headers||[]).map(h=>[h.name,h.value]))); w.append(hs);
  const c=setCookies(d.resp_headers); if(c.length){ const cs=sec('Set-Cookie'); cs.append(kvTable(c)); w.append(cs); }
  w.append(bodySection('Body', d.resp_body, d.id, 'resp'));
}
let pretty=true;
function bodySection(title, b, id, side){
  const aside=[];
  if(b.size){
    aside.push(el('span',null, fmtSize(b.size)+(b.encoding? ' '+b.encoding : '')+(b.content_type? ', '+b.content_type.split(';')[0] : '')));
    const raw=el('a',null,'Download'); raw.href=`/api/logs/${id}/body?side=${side}&mode=${b.encoding?'decoded':'raw'}`; raw.target='_blank'; aside.push(raw);
  }
  let json=null;
  if(b.is_text && b.text && !b.truncated){ try{ const t=b.text.trim(); if(t[0]==='{'||t[0]==='[') json=JSON.parse(t); }catch{} }
  if(json!==null){
    const seg=el('span','seg');
    for(const [v,l] of [[true,'Pretty'],[false,'Raw']]){ const x=el('button',null,l); x.setAttribute('aria-pressed', String(pretty===v)); x.onclick=()=>{ pretty=v; renderDetail(true); }; seg.append(x); }
    aside.push(seg);
  }
  if(b.is_text && b.text) { const cp=el('button','link','Copy'); cp.onclick=()=>copy(b.text,'Copied body'); aside.push(cp); }
  const s=sec(title, aside);
  if(!b.size){ s.append(el('p',null,'No body.')); return s; }
  const text = json!==null && pretty ? JSON.stringify(json,null,2) : (b.is_text ? b.text : b.hex);
  s.append(el('pre', b.is_text?'':'hex', text));
  if(b.truncated) s.append(el('p',null,'Showing the first 2 MB. Download for the full body.'));
  return s;
}
function messagesTab(w, d){
  const s=sec('Messages', [el('span',null, d.ws_open ? 'Connection open, updating live' : 'Connection closed')]);
  if(!d.ws_messages.length){ s.append(el('p',null, d.ws_open ? 'No messages yet.' : 'The connection closed without exchanging messages.')); w.append(s); return; }
  const box=el('div','msgs'); const t0=new Date(d.time).getTime();
  const ops={1:'text',2:'binary',8:'close',9:'ping',10:'pong','-1':'note'};
  for(const m of d.ws_messages){
    const r=el('div','msg');
    r.append(el('span','dir '+(m.from_client?'out':'in'), m.from_client?'↑':'↓'));
    r.lastChild.title = m.from_client ? 'Browser to server' : 'Server to browser';
    r.append(el('span','t', '+'+fmtMs(new Date(m.time).getTime()-t0)), el('span','ml ty', ops[m.opcode]||('op '+m.opcode)), el('span','mt sz', fmtSize(m.len)));
    r.append(el('pre', m.hex?'hex':'', m.text!=null ? m.text : m.hex));
    box.append(r);
  }
  s.append(box); w.append(s);
}
function shq(s){ return "'"+String(s).replace(/'/g,"'\\''")+"'"; }
function curlFor(d){
  const skip=new Set(['host','content-length','connection','proxy-connection','keep-alive','te','upgrade-insecure-requests']);
  const parts=['curl', shq(d.url)];
  if(d.method!=='GET') parts.push('-X', d.method);
  let compressed=false;
  for(const h of d.req_headers||[]){ const n=h.name.toLowerCase(); if(skip.has(n)) continue; if(n==='accept-encoding'){ compressed=true; continue; } parts.push('-H', shq(h.name+': '+h.value)); }
  if(compressed) parts.push('--compressed');
  if(d.req_body.size){ parts.push('--data-binary', d.req_body.is_text && !d.req_body.truncated ? shq(d.req_body.text) : '@body.bin'); }
  return parts.join(' ');
}
async function replay(){
  const r=await (await fetch(`/api/logs/${selId}/replay`,{method:'POST'})).json();
  if(!r.ok){ toast('Replay failed: '+r.error); return; }
  toast(r.err ? 'Replayed, upstream failed' : 'Replayed, got '+r.status);
  await poll(); select(r.id);
}
function copy(text,msg){ navigator.clipboard.writeText(text).then(()=>toast(msg), ()=>toast('Copy was blocked by the browser')); }
let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }
$('#back').onclick=()=>{ document.body.classList.remove('show-detail'); };

// ---------- settings ----------
$('#setbtn').onclick=e=>{ const s=$('#settings'); const open=!s.classList.contains('open'); s.classList.toggle('open',open); $('#setbtn').setAttribute('aria-expanded',String(open)); if(open) $('#port').focus(); e.stopPropagation(); };
document.addEventListener('click', e=>{ if(!e.target.closest('#settings') && e.target!==$('#setbtn')){ $('#settings').classList.remove('open'); $('#setbtn').setAttribute('aria-expanded','false'); } });
async function applyConfig(){
  const body={ listen_port:parseInt($('#port').value,10), upstream_url:$('#upstream').value.trim(), mitm_enabled:$('#mitm').checked, force_ua:$('#forceua').checked };
  const n=$('#note');
  try{
    const r=await (await fetch('/api/config',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)})).json();
    if(r.ok){ n.className='note ok'; n.textContent='Saved. Proxy listening on 127.0.0.1:'+r.proxy_port+'.'; loadStatus(); }
    else{ n.className='note err'; n.textContent=r.error||'Could not apply settings.'; }
  }catch(e){ n.className='note err'; n.textContent='Could not reach netlog.'; }
}
['#port','#upstream','#mitm','#forceua'].forEach(s=>$(s).addEventListener('change',applyConfig));
$('#harbtn').onclick=()=>{ const a=el('a'); a.href='/api/har'; a.download=''; document.body.append(a); a.click(); a.remove(); toast('Exporting HAR'); };
$('#clear').onclick=async()=>{ await fetch('/api/clear',{method:'POST'}); rows=[]; byId.clear(); selId=null; detail=null; oldestId=0; $('#older').hidden=true;
  $('#durl').textContent='Select a request to see it in full.'; $('#dfacts').textContent=''; $('#tabs').textContent=''; $('#dbody').textContent=''; applyFilter(); };
let ft; $('#filter').addEventListener('input',()=>{ clearTimeout(ft); ft=setTimeout(applyFilter,120); });

// ---------- keyboard ----------
document.addEventListener('keydown', e=>{
  const typing = e.target.matches('input,textarea');
  if(e.key==='Escape'){
    if(typing && e.target.id==='filter'){ e.target.value=''; applyFilter(); e.target.blur(); return; }
    if($('#settings').classList.contains('open')){ $('#settings').classList.remove('open'); $('#setbtn').focus(); return; }
    document.body.classList.remove('show-detail'); return;
  }
  if(typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key==='/'){ e.preventDefault(); $('#filter').focus(); }
  else if(e.key==='j' || (e.key==='ArrowDown' && document.activeElement===rowsEl)){ e.preventDefault(); moveSel(1); }
  else if(e.key==='k' || (e.key==='ArrowUp' && document.activeElement===rowsEl)){ e.preventDefault(); moveSel(-1); }
});

loadStatus().then(poll); setInterval(poll,1000); setInterval(loadStatus,5000);
</script>
</body>
</html>
