<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>netlog</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234c8dff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M5 17h5l3-7 5 13 3-6h6' fill='none' stroke='%2306101f' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<script>try{const t=localStorage.getItem('netlog.theme');if(t)document.documentElement.dataset.theme=t}catch{}</script>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 13h4l2.5-6 4 12 2.5-5H22"/></svg></div>
    <div class="nav" id="nav">
      <span class="nav-pill" id="navpill"></span>
    </div>
    <div class="rail-foot">
      <button class="btn ghost icon" id="theme" title="Switch light / dark theme" aria-label="Switch theme"></button>
    </div>
  </nav>
  <header class="top">
    <h1 id="title">Proxy</h1>
    <div class="pulse" title="Requests per second, last 60 seconds. Red is failures.">
      <canvas id="pulse" width="360" height="56" aria-hidden="true"></canvas>
      <span class="rate" id="rate"><b>0</b> req/s</span>
    </div>
    <div class="route">
      <span class="status-dot" id="dot" title="Proxy listener"></span>
      <div class="pill" id="uppill"></div>
      <div class="pill" id="fppill"></div>
    </div>
  </header>
  <main class="view" id="view"></main>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
